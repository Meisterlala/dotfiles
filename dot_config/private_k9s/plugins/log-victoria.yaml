plugins:
  victoria-container-raw:
    shortCut: Shift-L
    description: "VictoriaLogs raw"
    scopes: [containers]
    command: sh
    background: false
    args:
      - -c
      - exec "${XDG_CONFIG_HOME:-$HOME/.config}/k9s/plugins/victoria-tui-launcher" "$@"
      - --
      - $CONTEXT
      - --container
      - $NAMESPACE
      - $POD
      - $NAME
      - raw
